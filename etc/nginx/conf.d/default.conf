# /etc/nginx/conf.d/default.conf
server {
  listen 80;
  server_name _;

  # ===== FRONT (Vite build) =====
  root  /usr/share/nginx/html;
  index index.html;

  # SPA fallback: любые несуществующие пути -> index.html
  location / {
    try_files $uri /index.html;
  }

  # Кэш для скомпилированных ассетов (js/css/woff)
  location ~* \.(?:js|css|woff2?|ttf|eot|otf)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # ===== API -> Django =====
  location /api/ {
    proxy_pass         http://backend:8000;
    proxy_http_version 1.1;
    proxy_redirect     off;

    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # важно для JWT
    proxy_set_header   Authorization     $http_authorization;

    # таймауты
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
  }

  # ===== STATIC/MEDIA (отдаёт Django/WhiteNoise) =====
  # Если статику уже раздаёт WhiteNoise (по /static/), этот прокси просто пробросит.
  # Если когда-то вынесешь статик/медиа в отдельные тома — поменяешь тут на alias.
  location /static/ {
    proxy_pass         http://backend:8000;
    proxy_http_version 1.1;
    proxy_redirect     off;

    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  location /media/ {
    proxy_pass         http://backend:8000;
    proxy_http_version 1.1;
    proxy_redirect     off;

    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # ===== Оптимизации / безопасность =====
  gzip on;
  gzip_min_length 1000;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

  client_max_body_size 20m;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
}
